<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | NestFinder</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- CSS Variables (Matching Homepage) --- */
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --secondary: #0f172a;
            --background: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #334155;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 12px;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* --- Split Layout --- */
        .login-container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* Left Side: Form Canvas */
        .form-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 3rem;
            background: var(--card-bg);
            max-width: 550px;
            position: relative;
        }

        /* Right Side: Visual Canvas */
        .image-side {
            flex: 1.5;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.7) 0%, rgba(37, 99, 235, 0.5) 100%), 
                        url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1200&q=80');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4rem;
            color: white;
        }

        .image-content {
            max-width: 500px;
        }

        .image-content h2 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .image-content p {
            font-size: 1.1rem;
            color: #e2e8f0;
            line-height: 1.6;
        }

        /* --- Top Logo / Back Navigation --- */
        .top-nav {
            position: absolute;
            top: 2rem;
            left: 3rem;
            right: 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--secondary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo i {
            color: var(--primary);
        }

        .back-link {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-muted);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: var(--transition);
        }

        .back-link:hover {
            color: var(--primary);
        }

        /* --- Form Elements --- */
        .form-wrapper {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }

        .form-header {
            margin-bottom: 2rem;
        }

        .form-header h1 {
            font-size: 2rem;
            color: var(--secondary);
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .form-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .form-header a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .form-header a:hover {
            text-decoration: underline;
        }

        /* Social Login Buttons */
        .social-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .btn-social {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: white;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--secondary);
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-social:hover {
            background: var(--background);
            border-color: #cbd5e1;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.5rem 0;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border);
        }

        .divider:not(:empty)::before { margin-right: .75rem; }
        .divider:not(:empty)::after { margin-left: .75rem; }

        /* Inputs */
        .input-group {
            margin-bottom: 1.25rem;
        }

        .input-group label {
            display: block;
            font-size: 0.870rem;
            font-weight: 600;
            color: var(--secondary);
            margin-bottom: 0.5rem;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 1rem;
            color: var(--text-muted);
        }

        .input-wrapper input {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 2.5rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition);
        }

        .input-wrapper input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        /* Form Utilities (Remember/Forgot) */
        .form-utils {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            color: var(--text-muted);
        }

        .remember-me input {
            accent-color: var(--primary);
            width: 16px;
            height: 16px;
        }

        .forgot-pass {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .forgot-pass:hover {
            text-decoration: underline;
        }

        /* Main Submit Button */
        .btn-submit {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.85rem;
            border-radius: var(--radius);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-submit:hover {
            background: var(--primary-hover);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        /* --- Responsive Design --- */
        @media (max-width: 900px) {
            .image-side {
                display: none;
            }
            .form-side {
                max-width: 100%;
                padding: 2rem;
            }
            .top-nav {
                left: 2rem;
                right: 2rem;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        
        <main class="form-side">
            <div class="top-nav">
                <a href="index.html" class="logo">
                    <i class="fa-solid fa-house-chimney-window"></i> NestFinder
                </a>
                <a href="index.html" class="back-link">
                    <i class="fa-solid fa-arrow-left"></i> Home
                </a>
            </div>

            <div class="form-wrapper">
                <div class="form-header">
                    <h1>Welcome Back</h1>
                    <p>Don't have an account? <a href="#">Create one free</a></p>
                </div>

                <div class="social-buttons">
                    <button class="btn-social">
                        <img src="https://authjs.dev/img/providers/google.svg" width="18" alt="Google"> Google
                    </button>
                    <button class="btn-social">
                        <img src="https://authjs.dev/img/providers/apple.svg" width="18" alt="Apple"> Apple
                    </button>
                </div>

                <div class="divider">or sign in with email</div>

                <form action="#" method="POST" onsubmit="event.preventDefault(); alert('Login simulated!');">
                    <div class="input-group">
                        <label for="email">Email Address</label>
                        <div class="input-wrapper">
                            <i class="fa-regular fa-envelope"></i>
                            <input type="email" id="email" placeholder="name@example.com" required autocomplete="email">
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
                        </div>
                    </div>

                    <div class="form-utils">
                        <label class="remember-me">
                            <input type="checkbox" id="remember">
                            <span>Keep me signed in</span>
                        </label>
                        <a href="#" class="forgot-pass">Forgot password?</a>
                    </div>

                    <button type="submit" class="btn-submit">Sign In to NestFinder</button>
                </form>
            </div>
        </main>

        <section class="image-side">
            <div class="image-content">
                <h2>Save houses. Compare scores. Find your fit.</h2>
                <p>Log in to access your curated dashboard, saved neighborhood vibe-checks, and custom TrueCost™ calculations.</p>
            </div>
        </section>

    </div>

</body>
</html>
